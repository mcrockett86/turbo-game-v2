<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbo: Lost & Found</title>
  <link rel="stylesheet" href="./turbo-web/css/style.css">
</head>
<body>
  <!-- Game Container -->
  <div id="game-container">

    <!-- Loading Screen -->
    <div id="loading-screen" class="screen active">
      <h1>Turbo: Lost & Found</h1>
      <p>Loading...</p>
    </div>

    <!-- Dog Selection Screen -->
    <div id="dog-select" class="screen hidden">
      <h1>Choose Your Dog</h1>
      <p class="subtitle">Every dog deserves a home.</p>
      <div id="dog-grid" class="dog-grid"></div>
      <button id="start-adventure-btn" class="hidden">Start Adventure</button>
      <div class="controls-legend" id="controls-legend">
        <div class="controls-row"><span class="key">W A S D</span> / <span class="key">← ↑ ↓ →</span> <span class="label">move</span></div>
        <div class="controls-row"><span class="key">E</span> / <span class="key">Space</span> <span class="label">interact — threats &amp; zone gates</span></div>
        <div class="controls-row"><span class="auto">auto</span> <span class="label">treats, bones &amp; clues pick up on touch</span></div>
        <div class="controls-row"><span class="key">I</span> <span class="label">inventory</span> <span class="key">C</span> <span class="label">companions</span> <span class="key">H</span> <span class="label">hint</span></div>
      </div>
    </div>

    <!-- Game View Container -->
    <div id="game-view" class="screen hidden">
      <canvas id="game-canvas" width="1280" height="720"></canvas>
      <div id="hud-overlay">
        <div id="happiness-bar-container">
          <span id="happiness-label">HAPPINESS</span>
          <div id="happiness-bar"><div id="happiness-fill"></div></div>
        </div>
        <div id="zone-indicator"></div>
        <button id="hint-btn" class="hud-btn">🗺️</button>
      </div>
    </div>

  </div>

  <script type="module" src="./turbo-web/src/main.ts"></script>
</body>
</html>
